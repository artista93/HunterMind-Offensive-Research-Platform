[build-system]
requires = ["setuptools>=45.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huntermind"
version = "1.0.0"
description = "Autonomous Offensive Security Intelligence Platform"
authors = [{name = "HunterMind Team", email = "artistajaafari@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=12.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = [
    "tensorflow>=2.13.0",
    "torch>=2.0.0",
]
research = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]

[project.scripts]
huntermind = "cli:main"
huntermind-api = "interfaces.api.fastapi_server:main"
huntermind-dashboard = "interfaces.dashboard.dashboard_server:main"

[tool.setuptools.packages.find]
include = ["offensive*", "agents*", "cognition*", "learning*", "orchestration*", "interfaces*", "infrastructure*", "storage*", "telemetry*", "schemas*"]
exclude = ["tests*", "docs*", "datasets*", "models*", "scripts*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=offensive --cov=agents --cov=cognition --cov-report=html"
