[build-system]
requires = ["setuptools>=45.0.0", "wheel", "poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "huntermind"
version = "1.0.0"
description = "Autonomous Offensive Security Intelligence Platform"
authors = ["HunterMind Team <artistajaafari@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/akkalighter/HunterMind_Offensive_Research_Platform"
keywords = ["security", "offensive", "pentesting", "automation", "ai", "ml"]

[tool.poetry.dependencies]
python = "^3.9"
aiohttp = "^3.8"
httpx = "^0.24"
fastapi = "^0.100"
uvicorn = "^0.23"
playwright = "^1.40"
tensorflow = "^2.13"
torch = "^2.0"
numpy = "^1.24"
pandas = "^2.0"
scikit-learn = "^1.3"
psutil = "^5.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
black = "^23.7"
ruff = "^0.0.285"
mypy = "^1.4"
pre-commit = "^3.3"

[tool.poetry.scripts]
huntermind = "cli:main"
huntermind-api = "interfaces.api.fastapi_server:main"
huntermind-dashboard = "interfaces.dashboard.dashboard_server:main"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=offensive --cov=agents --cov=cognition --cov-report=html"

[tool.coverage.run]
source = ["offensive", "agents", "cognition", "learning", "orchestration"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.isort]
profile = "black"
line_length = 100
