# Offensive Configuration
# =======================

scanners:
  # === موجودين سابقاً ===
  xss:
    enabled: true
    rate_limit: 2.0
    timeout: 30
    verify_execution: true
    payloads: ["basic", "advanced", "dom"]
    max_payloads: 100

  sqli:
    enabled: true
    rate_limit: 1.0
    timeout: 30
    boolean_threshold: 0.2
    time_threshold: 4.0
    techniques: ["boolean", "time", "error", "union"]
    extract_data: true

  idor:
    enabled: true
    rate_limit: 2.0
    timeout: 30
    test_increment: true
    test_decrement: true
    max_ids_to_test: 20

  # === مضافين حديثاً ===
  rce:
    enabled: true
    rate_limit: 0.5
    timeout: 60
    time_threshold: 4.0
    test_all_parameters: true
    detect_output: true
    platforms: ["linux", "windows"]
    techniques: ["cmd", "eval", "time", "dns"]

  ssrf:
    enabled: true
    rate_limit: 1.0
    timeout: 30
    detect_cloud_metadata: true
    test_file_access: true
    test_ports: [22, 80, 443, 3306, 5432, 6379, 9200, 11211]
    bypass_techniques: true

  csrf:
    enabled: true
    rate_limit: 2.0
    timeout: 30
    test_all_forms: true
    check_samesite: true
    token_strength_check: true
    generate_poc: true

  auth:
    enabled: true
    rate_limit: 1.0
    timeout: 30
    test_weak_passwords: true
    analyze_jwt: true
    check_session_fixation: true
    weak_password_list: ["password", "123456", "admin", "admin123"]

  graphql:
    enabled: true
    rate_limit: 1.0
    timeout: 30
    enable_introspection: true
    enable_complexity_tests: true
    max_field_depth: 10
    detect_batching: true

  api:
    enabled: true
    rate_limit: 2.0
    timeout: 30
    test_idor: true
    test_mass_assignment: true
    detect_rate_limiting: true
    max_ids_to_test: 10
    check_swagger: true

# ===== باقي الإعدادات (لم تتغير) =====
payloads:
  generator:
    max_payloads: 100
    encoding_types: ["url", "html", "base64", "hex"]
  mutator:
    enabled: true
    mutation_rate: 0.3
  ranker:
    enabled: true
    top_k: 10

recon:
  crawler:
    max_depth: 3
    max_pages: 100
    rate_limit: 1.0
  js_processor:
    enabled: true
    analyze_inline: true

exploitation:
  orchestrator:
    max_concurrent: 5
    retry_attempts: 3
  chains:
    enabled: true
    max_chain_length: 5

pipelines:
  xss:
    enabled: true
    auto_exploit: true
  sqli:
    enabled: true
    extract_data: true
  idor:
    enabled: true
    detect_sensitive: true
  rce:
    enabled: true
    safe_mode: true
  ssrf:
    enabled: true
    detect_internal: true
