# Offensive Configuration
# =======================

scanners:
  xss:
    enabled: true
    payloads: ["basic", "advanced", "dom"]
  sqli:
    enabled: true
    techniques: ["boolean", "time", "error", "union"]
  idor:
    enabled: true
    max_ids_to_test: 20

payloads:
  generator:
    max_payloads: 100
    encoding_types: ["url", "html", "base64", "hex"]
  mutator:
    enabled: true
    mutation_rate: 0.3
  ranker:
    enabled: true
    top_k: 10

recon:
