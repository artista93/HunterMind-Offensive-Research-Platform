    max_depth: 3
    max_pages: 100
  js_processor:
    enabled: true
    analyze_inline: true

exploitation:
  orchestrator:
    max_concurrent: 5
    retry_attempts: 3
  chains:
    enabled: true
    max_chain_length: 5

pipelines:
  xss:
    enabled: true
    auto_exploit: true
  sqli:
    enabled: true
    extract_data: true
  idor:
    enabled: true
    detect_sensitive: true
